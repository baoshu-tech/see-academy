h2>学术学习能力</h2></div><div class=\"ability-rule\" aria-hidden=\"true\"></div><p>通过融合课程、预科课程与学术写作训练，帮助学生提前适应海外大学的学习方式。<br>让孩子不仅能进入大学，也能跟得上大学。</p></div>\n    <div class=\"ability-course\"><h3>学术融合课程</h3><p>保留国内阶段必要的学术基础，逐步引入国际化学习方式，帮学生完成从国内课堂到海外大学课堂的过渡。</p></div>\n  </article>\n  <article class=\"ability-row\">\n    <div class=\"ability-purpose\"><div class=\"ability-name\"><span class=\"ability-number\">03</span><h2>跨文化沟通能力</h2></div><div class=\"ability-rule\" aria-hidden=\"true\"></div><p>通过演讲表达、国际通识课程、海外教授课堂和真实情境训练，让学生理解不同文化、不同视角和不同表达方式。</p></div>\n    <div class=\"ability-course\"><h3>海外技能通识课程</h3><p>覆盖学术写作、演讲表达、AI工具、IT信息技术、艺术拓展等模块，帮助学生打开视野，建立跨学科能力与国际化思维。</p></div>\n  </article>\n  <article class=\"ability-row ability-row-wide\">\n    <div class=\"ability-purpose\"><div class=\"ability-name\"><span class=\"ability-number\">04</span><h2>真实世界解决问题的能力</h2></div><div class=\"ability-rule\" aria-hidden=\"true\"></div><p>通过PBL项目、企业参访、商业探索和职业认知，让学生不只停留在书本里，而是逐渐理解真实世界如何运转。</p></div>\n    <div class=\"ability-course\"><h3>PBL商业职业探索课程</h3><p>通过企业参访、行业调研、用户访谈、商业策划和项目展示，让学生在真实任务中完成从认知到表达的转化。</p></div>\n  </article>\n  <div class=\"abilities-promise\"><p>我们要培养的，不是只会考试的学生<br>而是<strong>能够学习、表达、协作、思考</strong><br>持续成长的<strong>未来领袖！</strong></p></div>\n</section>\n", "singapore/overview": "<section class=\"programme-focus sg-overview\" aria-labelledby=\"programme-name\">\n          <div class=\"focus-label\"><span>01 / SUZHOU → SINGAPORE</span><span>看见学院 · 国际融合教育</span></div>\n          <div class=\"focus-top\"><div class=\"focus-copy\"><h1 id=\"programme-name\">中新国际融合班</h1><h2>初中毕业，<br><em>直通新加坡SIM！</em></h2><div class=\"focus-actions\"><a class=\"btn\" href=\"#singapore/path\">了解升学路径 <span>↗</span></a><a class=\"text-link\" href=\"#singapore/universities\">查看目标升学院校 ↗</a></div></div><div class=\"focus-visual\"><div class=\"sg-carousel campus-carousel gallery-compact\" data-campus-carousel role=\"region\" aria-label=\"中新班校园照片自动轮播\" aria-roledescription=\"轮播\" data-items=\"[{&quot;key -pressed=\"false\" class=\"\"></button><button data-carousel-index=\"4\" aria-label=\"查看校园长廊\" aria-pressed=\"false\" class=\"\"></button><button data-carousel-index=\"5\" aria-label=\"查看园林庭院\" aria-pressed=\"false\" class=\"\"></button><button data-carousel-index=\"6\" aria-label=\"查看教学楼群\" aria-pressed=\"false\" class=\"\"></button><button data-carousel-index=\"7\" aria-label=\"查看校园建筑\" aria-pressed=\"false\" class=\"\"></button><button data-carousel-index=\"8\" aria-label=\"查看国际课程长廊\" aria-pressed=\"false\" class=\"\"></button></div></div></div></div><div class=\"benefit-ribbon\"><article class=\"benefit\"><h3 class=\"benefit-title\">SIM管理学院</h3><p>新加坡排名第一私立大学！</p></article><article class=\"benefit\"><h3 class=\"benefit-title\">免雅思语言门槛</h3><p>通过校内课程及内测达标，无需额外语言成绩！</p></article><article class=\"benefit\"><h3 class=\"benefit-title\">拿世界TOP100名校本科文凭</h3><p>全球认可度高，升学就业跳板灵活，中留服认证！</p></article></div>\n          <div class=\"partner-line\"><span>携手培养</span><div><strong>南京师范大学苏州实验学校</strong><span>承担国内阶段培养，设立SIM海外教学中心。</span></div><div><strong>新加坡管理学院 SIM</strong><span>衔接国际大一与合作大学专业课程。</span></div></div>\n        </section>", "singapore/universities": "<div class=\"heading\"><span class=\"eyebrow\">TARGET UNIVERSITIES</span><h1>目标升学院校</h1><p>在新加坡SIM，衔接合作大学与适合自己的专业。</p></div><div class=\"table-scroll university-table\"><table><thead><tr><th>合作大学</th><th>2027年QS排名</th><th>大致对标中国高校</th></tr></thead><tbody><tr><td>伦敦大学（伦敦大学学院） · University of London (UCL)</td><td><span class=\"qs-rank\">8</span></td><td>香港大学（11）、北京大学（13）、清华大学（14）</td></tr><tr><td>伦敦大学（伦敦政经学院） · University of London (LSE)</td><td><span class=\"qs-rank\">62</span></td><td>复旦大学（26）、上海交通大学（36）、浙江大学（47）</td></tr><tr><td>伯明翰大学 · University of Birmingham</td><td><span class=\"qs-rank\">68</span></td><td>南京大学（90）</td></tr><tr><td>皇家墨尔本理工大学 · RMIT</td><td><span class=\"qs-rank\">119</span></td><td>中国科学技术大学（134）</td></tr><tr><td>沃隆港大学 · University of Wollongong</td><td><span class=\"qs-rank\">195</span></td><td>武汉大学（165）</td></tr><tr><td>伦敦大学（金史密斯学院） · University of London (Goldsmiths)</td><td><span class=\"qs-rank\">701–710</span></td><td>南京理工大学（675）</td></tr></tbody></table></div><div class=\"full-grid\"><article class=\"full-card \"><h3>英国伯明翰大学 · QS68</h3><p>会计与金融 / 商业管理 / 国际商务 / 商业管理与传播 / 商业管理与应用实习</p></article><article class=\"full-card \"><h3>皇家墨尔本理工大学 · QS119</h3><p>会计学 / 商学 / 专业传播学</p></article><article class=\"full-card \"><h3>沃隆港大学 · QS195</h3><p>大数据 / 数字系统安全 / 游戏与移动开发 / 网络安全</p></article><article class=\"full-card warm\"><h3>本科之后的进阶方向</h3><p>以SIM本科为跳板，弯道超车申请港三新二更丝滑。申请新加坡PR，更有独家加分优势。</p></article></div><section class=\"degree-future\"><span class=\"eyebrow\">YOUR NEXT CHAPTER</span><h2>一条能考研、能就业、能落户的进阶人生路，<em>Get！</em></h2><div class=\"degree-proof-row\"><p>中新班学生完成SIM合作大学对应课程后，由合作大学颁发本硕学位。中留服全面认证，能考研、能考公、能升学、能落户，晋升前景光明！</p><div class=\"certificate-display\"><button class=\"photo certificate-photo\" data-image=\"sg-certificate\" aria-label=\"放大查看：伯明翰大学学位证书与国外学历学位认证书\"><img data-media=\"sg-certificate\" alt=\"伯明翰大学学位证书与国外学历学位认证书\"><span class=\"photo-zoom\">↗</span></button><p>学位证书与学历学位认证书展示 · 点击查看大图</p></div></div></section>", "singapore/path": "<div class=\"heading\"><span class=\"eyebrow\">YOUR PATHWAY / SINGAPORE</span><h1>一条更清晰、更稳定、更可实现的国际升学路！</h1></div><div class=\"path-tabs\" role=\"tablist\" aria-label=\"升学路径内容\"><button id=\"tab-compare\" role=\"tab\" aria-selected=\"true\" aria-controls=\"path-compare\" data-path-tab=\"compare\">为什么选择中新班</button><button id=\"tab-steps\" role=\"tab\" aria-selected=\"false\" aria-controls=\"path-steps\" data-path-tab=\"steps\" tabindex=\"-1\">点击查看六步升学路径</button></div><section id=\"path-compare\" class=\"path-view\" role=\"tabpanel\" aria-labelledby=\"tab-compare\"><div class=\"comparison-head\"><span class=\"eyebrow\">选择 SIM 中新班，得到的究竟是什么？</span><h2>对比传统升学，中新班<br><span>速度<em>更快</em>、效率<em>更高</em>、路径<em>更稳</em></span></h2></div><div class=\"path-comparison\"><div class=\"comparison-tools\"><span>从高中到研究生 · 升学路径对比</span><button data-replay-comparison>重播对比 ↻</button></div><div class=\"timeline-scroll\"><div class=\"timeline-canvas\"><div class=\"lane-label\">传统升学通道<span>高中 → 本科 → 研究生</span></div><div class=\"timeline-lane traditional\"><span style=\"--i:0\">高一</span><span style=\"--i:1\">高二</span><span style=\"--i:2\">高三</span><span style=\"--i:3\">大一</span><span style=\"--i:4\">大二</span><span style=\"--i:5\">大三</span><span style=\"--i:6\">大四</span><span style=\"--i:7\">研一</span><span style=\"--i:8\">研二</span><span style=\"--i:9\">研三</span></div><div class=\"lane-label sim-label\">SIM 中新班<span>高中 → 国际大一 → 本科 → 研究生</span></div><div class=\"sim-track\"><div class=\"timeline-lane sim\"><span style=\"--i:0\">高一</span><span style=\"--i:1\">高二</span><span style=\"--i:2\">高三上</span><span style=\"--i:3\">国际大一</span><span style=\"--i:4\">大二</span><span style=\"--i:5\">大三</span><span style=\"--i:6\">研一</span></div><div class=\"time-saved\"><span>节省</span><strong>3</strong><span>年时间</span></div></div></div></div><p class=\"comparison-caption\">节省三年时间，让成长与未来更早相遇。</p></div><div class=\"path-assurances\"><article><span>01 / LANGUAGE</span><h3>免雅思直录</h3><p>通过校内课程及内测达标，无需额外语言成绩。</p></article><article><span>02 / SUPPORT</span><h3>保底机制</h3><p>若国内2.5年预科成绩未达标，可延长读0.5年，确保升学无风险。</p></article></div></section><section id=\"path-steps\" class=\"path-view sg-step-view\" role=\"tabpanel\" aria-labelledby=\"tab-steps\" hidden><div class=\"curve-heading\"><div><span class=\"eyebrow\">YOUR PATHWAY / SIX STEPS</span><h2>每一步，都知道去哪里。</h2></div></div><div class=\"curve-map\"><svg viewBox=\"0 0 1000 400\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><defs><path data-curve-guide d=\"M80 96 C220 10 360 10 500 96\"/><path data-curve-guide d=\"M500 96 C640 182 780 182 920 96\"/><path data-curve-guide d=\"M920 96 C1010 96 1010 304 920 304\"/><path data-curve-guide d=\"M920 304 C780 390 640 390 500 304\"/><path data-curve-guide d=\"M500 304 C360 218 220 218 80 304\"/></defs><path class=\"curve-base\" d=\"M80 96 C220 10 360 10 500 96 C640 182 780 182 920 96 C1010 96 1010 304 920 304 C780 390 640 390 500 304 C360 218 220 218 80 304\"/><path class=\"curve-progress\" style=\"visibility:hidden\" d=\"M80 96 C220 10 360 10 500 96 C640 182 780 182 920 96 C1010 96 1010 304 920 304 C780 390 640 390 500 304 C360 218 220 218 80 304\"/><circle class=\"curve-marker\" cx=\"80\" cy=\"96\" r=\"5\"/></svg><button class=\"curve-node active\" data-curve-step=\"0\" data-detail=\"初中毕业。\" style=\"--x:8%;--y:24%\" aria-pressed=\"true\"><b>01</b><strong>初中毕业</strong><small>开启国际升学</small></button><button class=\"curve-node \" data-curve-step=\"1\" data-detail=\"通过入学笔面试（笔试以英文为主）。\" style=\"--x:50%;--y:24%\" aria-pressed=\"false\"><b>02</b><strong>入学笔面试</strong><small>通过入学笔面试（笔试以英文为主）。</small></button><button class=\"curve-node \" data-curve-step=\"2\" data-detail=\"在国内就读2.5—3年（上海校区3年、南师大苏州校区2.5年）。\" style=\"--x:92%;--y:24%\" aria-pressed=\"false\"><b>03</b><strong>国内系统培养</strong><small>在国内就读2.5—3年（上海校区3年、南师大苏州校区2.5年）。</small></button><button class=\"curve-node \" data-curve-step=\"3\" data-detail=\"去新加坡SIM就读国际大一（国际大一有两种学制：15个月和12个月）。\" style=\"--x:92%;--y:76%\" aria-pressed=\"false\"><b>04</b><strong>SIM国际大一</strong><small>12或15个月</small></button><button class=\"curve-node \" data-curve-step=\"4\" data-detail=\"完成国际大一课程后，衔接海外大学的细分专业课（仍然在新加坡当地就读），读2年。\" style=\"--x:50%;--y:76%\" aria-pressed=\"false\"><b>05</b><strong>衔接专业课程</strong><small>在新加坡读2年</small></button><button class=\"curve-node \" data-curve-step=\"5\" data-detail=\"在新加坡SIM大学里，拿到对应海外大学的本科文凭，比如伯明翰大学、皇家墨尔本理工大学、沃隆港大学等。\" style=\"--x:8%;--y:76%\" aria-pressed=\"false\"><b>06</b><strong>取得本科文凭</strong><small>SIM对应合作大学</small></button></div><div class=\"curve-detail\" aria-live=\"off\"><span class=\"curve-counter\">01</span><div><h3>初中毕业</h3><p>初中毕业。</p></div></div><p class=\"curve-hint\">点击任一步骤，查看具体安排。</p></section>", "singapore/faq": "<div class=\"heading\"><span class=\"eyebrow\">YOUR QUESTIONS</span><h1>你关心的问题，我们都想到了。</h1></div><div class=\"faq-list\"><details><summary>孩子英语一般、理科不强，能适应吗？<span>＋</span></summary><p>可以。中新班通过分层教学、词测制度和助教追踪，帮助不同基础的孩子逐步建立学习节奏与语言信心。</p></details><details><summary>毕业证国内认可吗？<span>＋</span></summary><p>学生完成SIM合作大学对应课程后，由相应合作大学颁发本科或硕士学位。符合认证要求的学位，可申请中国教育部留学服务中心认证。</p></details><details><summary>孩子在校状态谁来管？<span>＋</span></summary><p>中新班采用寄宿制管理，并配备班主任、生活老师、德育主任、助教等多角色陪伴机制。学校会通过手机管理、作息管理和学习过程管理，帮助学生形成稳定、健康的学习节奏。</p></details><details><summary>中新班和普通国际高中有什么不同？<span>＋</span></summary><p>普通国际高中通常更依赖学生英语基础、自律能力和国际课程适应能力。中新班更强调路径衔接、过程培养、稳定管理和能力建设，适合希望稳妥规划国际升学的家庭。</p></details><details><summary>如果孩子阶段成绩没有达到要求怎么办？<span>＋</span></summary><p>学校会根据学生阶段成绩和学习状态持续跟进，提供学习支持。暂时未达到最快衔接要求的学生，也可结合实际情况延长学习周期或选择更适合的升学方案，更提供QS前200内的其他大学保底选项，升学有兜底。</p></details></div>", "malaysia/overview": "<section class=\"programme-focus sg-overview\" aria-labelledby=\"programme-name\">\n          <div class=\"focus-label\"><span>02 / SHANGHAI → MALAYSIA</span><span>看见学院 · 国际融合教育</span></div>\n          <div class=\"focus-top\"><div class=\"focus-copy\"><h1 id=\"programme-name\">中马国际融合班</h1><h2>初中毕业，<br><em>直达马来亚大学！</em><span class=\"programme-rank\">QS56！</span></h2><div class=\"focus-actions\"><a class=\"btn\" href=\"#malaysia/path\">了解升学路径 <span>↗</span></a><a class=\"text-link\" href=\"#malaysia/foundation\">查看预科方向 ↗</a></div></div><div class=\"focus-visual\"><div class=\"sg-carousel campus-carousel gallery-compact\" data-campus-carousel role=\"region\" aria-label=\"中马班校园照片自动轮播\" aria-roledescription=\"轮播\" data-items=\"[{&quot;key&quot;: &quot;my-new-0&quot;, &quot;label&quot;: &quot;校园与篮球场&quot;}, {&quot;key&quot;: &quot;my-new-1&quot;, &quot;label&quot;: &quot;校园全景&quot;}, {&quot;key&quot;: &quot;my-new-2&quot;, &quot;label&quot;: &quot;校园建筑&quot;}, {&quot;key&quot;: &quot;my-new-3&quot;, &quot;label&quot;: &quot;教室&quot;}, {&quot;key&quot;: &quot;my-new-4&quot;, &quot;label&quot;: &quot;图书馆&quot;}, {&quot;key&quot;: &quot;my-new-5&quot;, &quot;label&quot;: &quot;健身房&quot;}, {&quot;key&quot;: &quot;my-new-6&quot;, &quot;label&quot; 陪伴学生完成国内阶段成长。</span></div><div><strong>马来亚大学</strong><span>官方预科衔接本科，通向马大专业学习。</span></div></div>\n        </section>", "malaysia/path": "<div class=\"heading\"><span class=\"eyebrow\">YOUR PATHWAY</span><h1>一条更清晰、更稳定、更可实现的国际升学路！</h1></div><section class=\"path-view malaysia-curve\" aria-label=\"中马班五步升学路径\"><div class=\"curve-heading\"><div><span class=\"eyebrow\">CHINA → MALAYSIA / FIVE STEPS</span><h2>初中毕业，直通马来亚大学。</h2></div><span class=\"malaysia-duration\">2 <small>年融合班</small> + 1 <small>年预科</small> + 3.5 <small>年本科</small></span></div><div class=\"curve-map\" data-autostart><svg viewBox=\"0 0 1000 400\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><defs><path data-curve-guide d=\"M80 96 C220 10 360 10 500 96\"/><path data-curve-guide d=\"M500 96 C640 182 780 182 920 96\"/><path data-curve-guide d=\"M920 96 C1010 96 1010 304 920 304\"/><path data-curve-guide d=\"M920 304 C640 420 360 188 80 304\"/></defs><path class=\"curve-base\" d=\"M80 96 C220 10 360 10 500 96 C640 182 780 182 920 96 C1010 96 1010 304 920 304 C640 420 360 188 80 304\"/><path class=\"curve-progress\" style=\"visibility:hidden\" d=\"M80 96 C220 10 360 10 500 96 C640 182 780 182 920 96 C1010 96 1010 304 920 304 C640 420 360 188 80 304\"/><circle class=\"curve-marker\" cx=\"80\" cy=\"96\" r=\"5\"/></svg><button class=\"curve-node active\" data-curve-step=\"0\" data-detail=\"初中毕业。\" style=\"--x:8%;--y:24%\" aria-pressed=\"true\"><b>01</b><strong>初中毕业</strong><small>开启国际升学</small></button><button class=\"curve-node \" data-curve-step=\"1\" data-detail=\"通过中马国际融合班的入学笔面试。\" style=\"--x:50%;--y:24%\" aria-pressed=\"false\"><b>02</b><strong>入学笔面试</strong><small>通过入学评估</small></button><button class=\"curve-node \" data-curve-step=\"2\" data-detail=\"在中马国际融合班就读2年。\" style=\"--x:92%;--y:24%\" aria-pressed=\"false\"><b>03</b><strong>中马班学习</strong><small>国内就读2年</small></button><button class=\"curve-node \" data-curve-step=\"3\" data-detail=\"前往马来亚大学官方预科中国中心就读1年。\" style=\"--x:92%;--y:76%\" aria-pressed=\"false\"><b>04</b><strong>马大官方预科</strong><small>中国中心就读1年</small></button><button class=\"curve-node \" data-curve-step=\"4\" data-detail=\"前往马来亚大学就读本科，读3.5年。\" style=\"--x:8%;--y:76%\" aria-pressed=\"false\"><b>05</b><strong>马来亚大学本科</strong><small>本科就读3.5年</small></button></div><div class=\"curve-detail\" aria-live=\"off\"><span class=\"curve-counter\">01</span><div><h3>初中毕业</h3><p>初中毕业。</p></div></div><p class=\"curve-hint\">点击任一步骤，查看具体安排。</p></section><aside class=\"my-language-note\"><h3>免雅思直录</h3><p>通过校内课程及内测达标，升学预科、直升马大，均无需额外语言成绩。</p></aside><section class=\"my-comparison\" aria-labelledby=\"my-comparison-title\">\n <div class=\"my-compare-heading\"><span class=\"eyebrow\">TWO ROUTES / 升学路线对比</span><h2 id=\"my-comparison-title\">对比传统升学，中马班<br><span>速度更<em>快</em>、效率更<em>高</em>、路径更<em>稳</em>！</span></h2><div class=\"my-compare-rule\" aria-hidden=\"true\"><i></i></div></div>\n <div class=\"my-compare-tools\"><span>从高中到本科，同一起点看两条路径。</span><button data-replay-my>重播对比 ↻</button></div>\n <div class=\"my-route-table\" role=\"table\" aria-label=\"传统升学七年与中马班六年半路径对比\">\n  <div class=\"my-route-label traditional\" role=\"row\"><span role=\"columnheader\">传统升学路线</span><small>高中 3 年 + 本科 4 年</small></div>\n  <div class=\"my-traditional-row\" role=\"row\"><span style=\"--delay:0s\" role=\"cell\">高一</span><span style=\"--delay:.4s\" role=\"cell\">高二</span><span style=\"--delay:.8s\" role=\"cell\">高三</span><span style=\"--delay:1.2s\" role=\"cell\">大一</span><span style=\"--delay:1.6s\" role=\"cell\">大二</span><span style=\"--delay:2s\" role=\"cell\">大三</span><span style=\"--delay:2.4s\" role=\"cell\">大四</span></div>\n  <div class=\"my-route-label international\" role=\"row\"><span role=\"columnheader\">中马班升学路线</span><small>2 年 + 1 年 + 3.5 年</small></div>\n  <div class=\"my-international-row\" role=\"row\"><div class=\"my-stage\" style=\"--delay:0s;--duration:.8s\" role=\"cell\"><strong>中马班</strong><small>2年</small></div><div class=\"my-stage foundation\" style=\"--delay:.8s;--duration:.4s\" role=\"cell\"><strong>马来亚大学<br>官方预科</strong><small>1年</small></div><div class=\"my-stage bachelor\" style=\"--delay:1.2s;--duration:1.4s\" role=\"cell\"><strong>马来亚大学本科</strong><small>3.5年 · 世界排名第 <b>56</b> 位</small></div><div class=\"my-time-gap\" aria-label=\"节省半年时间\" role=\"cell\"><span class=\"gap-label\">提前<b>0.5</b>年</span></div></div>\n </div>\n <p class=\"my-compare-conclusion\">不仅有效<strong class=\"my-saving\">节省半年时间</strong>，更避开高考内卷压力，<br>直升<strong class=\"my-qs\">世界QS56名校</strong>，升学路线更稳更清晰！</p>\n</section>\n<section class=\"degree-future\"><span class=\"eyebrow\">YOUR NEXT CHAPTER</span><h2>一条能考研、能就业、能考公、能落户的进阶人生路，<em>get！</em></h2><div class=\"degree-proof-row\"><p>中马班学生升入马来亚大学并毕业后，颁发相应毕业证。<br><strong>中留服全面认证！</strong>能考研、能考公、能升学、能落户，晋升前景光明！</p><div class=\"certificate-display\"><button class=\"photo certificate-photo\" data-image=\"sg-certificate\" aria-label=\"放大查看：中马班学位及认证配图\"><img data-media=\"sg-certificate\" alt=\"学位证书与学历学位认证书展示\" loading=\"lazy\"><span class=\"photo-zoom\">↗</span></button><p>学位及认证配图 · 点击查看大图</p></div></div></section>", "malaysia/faq": "<div class=\"heading\"><span class=\"eyebrow\">YOUR QUESTIONS</span><h1>你关心的问题，我们都想到了。</h1></div><div class=\"faq-list\"><details><summary>孩子英语一般、理科不强，能适应吗？<span>＋</span></summary><p>可以。中马班通过分层教学、词测制度和助教追踪，帮助不同基础的孩子逐步建立学习节奏与语言信心。</p></details><details><summary>毕业证国内认可吗？<span>＋</span></summary><p>学生完成马来亚大学课程并毕业，均可申请中国教育部留学服务中心认证。</p></details><details><summary>孩子在校状态谁来管？<span>＋</span></summary><p>中马班采用寄宿制管理，并配备班主任、生活老师、德育主任、助教等多角色陪伴机制。学校会通过手机管理、作息管理和学习过程管理，帮助学生形成稳定、健康的学习节奏。</p></details><details><summary>中马班和普通国际高中有什么不同？<span>＋</span></summary><p>普通国际高中通常更依赖学生英语基础、自律能力和国际课程适应能力。中马班更强调路径衔接、过程培养、稳定管理和能力建设，适合希望稳妥规划国际升学的家庭。</p></details></div>", "singapore/courses": "<div class=\"heading\"><span class=\"eyebrow\">CURRICULUM / SINGAPORE</span><h1>从语言基础，到国际课堂。</h1><p>不是把课排满，而是让每一天都有成长重点。</p></div>\n<section class=\"year-curriculum\" aria-label=\"高一至高三课程安排\">\n <article class=\"year-column\"><h2>高一课程</h2><div class=\"year-modules\">\n  <div class=\"course-module\"><b>50<span>%</span></b><div><h3>雅思听说读写</h3><p>Unlock听说＋读写、雅思词汇书、英语角</p></div></div>\n  <div class=\"course-module\"><b>40<span>%</span></b><div><h3>高中融合课程</h3><p>数学、语文、历史、地理、政治、经济、体育</p></div></div>\n  <div class=\"course-module\"><b>10<span>%</span></b><div><h3>定制化课程</h3><p>演讲、IT信息技术、PBL职业探索／戏剧</p></div></div>\n </div></article>\n <article class=\"year-column\"><h2>高二课程</h2><div class=\"year-modules\">\n  <div class=\"course-module\"><b>40<span>%</span></b><div><h3>雅思听说读写</h3><p>Unlock听说＋读写、雅思真题</p></div></div>\n  <div class=\"course-module\"><b>20<span>%</span></b><div><h3>高中融合课程</h3><p>IG数学、经济、历史、政治、地理</p></div></div>\n  <div class=\"course-module\"><b>30<span>%</span></b><div><h3>新加坡SIM的CPB课程<br>＋CFS课程</h3></div></div>\n  <div class=\"course-module\"><b>10<span>%</span></b><div><h3>定制化课程</h3><p>IT信息技术、PBL职业探索／戏剧</p></div></div>\n </div></article>\n <article class=\"year-column senior-year\"><h2>高三课程</h2><div class=\"year-modules\">\n  <div class=\"semester\"><span>高三（上）</span><h3>SIM的本科预科课程MFS</h3></div>\n  <div class=\"semester\"><span>高三（下）</span><h3>进入新加坡SIM国际大一</h3></div>\n </div></article>\n</section>\n<section class=\"weekly-plan\" aria-labelledby=\"weekly-title\"><div class=\"weekly-heading\"><span class=\"eyebrow\">A WEEK AT SCHOOL</span><h2 id=\"weekly-title\">示范课表，让学习节奏看得见</h2><p>注：以下为示范课表结构，实际课表以学校最终排课为准。</p></div>\n<p class=\"weekly-swipe-hint\">左右滑动，可查看完整周课表 →</p><div class=\"table-scroll weekly-table\"><table><caption class=\"visually-hidden\">中新班示范周课表</caption><thead><tr><th scope=\"col\">周一</th><th scope=\"col\">周二</th><th scope=\"col\">周三</th><th scope=\"col\">周四</th><th scope=\"col\">周五</th></tr></thead><tbody>\n<tr class=\"shared-session\"><td colspan=\"5\">英文阅读</td></tr>\n<tr><td>英语（阅读）</td><td>英语（听力）</td><td>英语（阅读）</td><td>英语（听力）</td><td>英语（阅读）</td></tr>\n<tr><td>数学</td><td>数学</td><td>数学</td><td>数学</td><td>数学</td></tr>\n<tr class=\"break-session\"><td colspan=\"5\">大课间</td></tr>\n<tr><td>英语（写作）</td><td>英语（口语）</td><td>英语（写作）</td><td>英语（口语）</td><td>英语（写作）</td></tr>\n<tr><td>雅思（主课）</td><td>雅思（主课）</td><td>雅思（主课）</td><td>雅思（主课）</td><td>雅思（周测）</td></tr>\n<tr class=\"lunch-session\"><td colspan=\"5\">午餐＋午休</td></tr>\n<tr><td>政治</td><td>经济</td><td>经济</td><td>单词大闯关比赛</td><td rowspan=\"4\" class=\"pbl-session\">PBL商业职业探索</td></tr>\n<tr><td>经济</td><td>政治</td><td>体育</td><td>单词大闯关比赛</td></tr>\n<tr class=\"break-session\"><td colspan=\"4\">大课间</td></tr>\n<tr><td>体育</td><td>体育</td><td>政治</td><td>体育</td></tr>\n<tr><td>海外技能通识课：<br>艺术拓展</td><td>海外技能通识课：<br>学术写作</td><td>海外技能通识课：<br>演讲课程</td><td>海外技能通识课：<br>AI课程</td><td rowspan=\"2\" class=\"rest-session\">返程／休息</td></tr>\n<tr><td>日常单词小PK</td><td>日常单词小PK</td><td>日常单词小PK</td><td>政治</td></tr>\n</tbody></table></div></section>\n", "malaysia/courses": "<div class=\"heading my-curriculum-heading\"><span class=\"eyebrow\">GROW STEP BY STEP</span><h1>国际化的培养，体制内的管理</h1><p>中马班通过稳定的学习节奏、清晰的课程安排和持续的过程反馈，<br><strong>帮助学生逐步形成学习习惯、自我管理能力和成长信心。</strong></p></div>\n<section class=\"growth-pyramid\" aria-labelledby=\"pyramid-title\">\n <div class=\"pyramid-heading\"><h2 id=\"pyramid-title\">课程不是拼课表，而是搭台阶</h2><p>从知识到技能，从能力到素养，帮助学生完成大学预科过渡</p></div>\n <div class=\"pyramid-layout\">\n  <svg class=\"pyramid-graphic\" viewBox=\"0 0 320 360\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"由下向上：知识层、技能层、能力层、素养层\">\n   <defs><linearGradient id=\"pyramid-orange\"><stop stop-color=\"#bd421c\"/><stop offset=\"1\" stop-color=\"#ff8d48\"/></linearGradient></defs>\n   <g class=\"pyramid-layer\" style=\"--level:3\"><path d=\"M160 0 L200 90 H120 Z\"/><text x=\"160\" y=\"68\">4</text></g>\n   <g class=\"pyramid-layer\" style=\"--level:2\"><path d=\"M120 90 H200 L240 180 H80 Z\"/><text x=\"160\" y=\"147\">3</text></g>\n   <g class=\"pyramid-layer\" style=\"--level:1\"><path d=\"M80 180 H240 L280 270 H40 Z\"/><text x=\"160\" y=\"237\">2</text></g>\n   <g class=\"pyramid-layer\" style=\"--level:0\"><path d=\"M40 270 H280 L320 360 H0 Z\"/><text x=\"160\" y=\"327\">1</text></g>\n  </svg>\n  <div class=\"pyramid-descriptions\">\n   <div class=\"pyramid-layer pyramid-level\" style=\"--level:3\"><div><h3>素养层</h3><p>心理｜体育｜社团｜作息管理｜手机管理｜成长档案</p></div><aside><h4>素养是结果</h4><p>身心与习惯，支撑长远发展。</p></aside></div>\n   <div class=\"pyramid-layer pyramid-level\" style=\"--level:2\"><div><h3>能力层</h3><p>PBL｜圆桌会议｜演讲展示｜小组合作｜项目汇报｜职业探索</p></div><aside><h4>能力是运用</h4><p>项目与协作，将技能转为实践。</p></aside></div>\n   <div class=\"pyramid-layer pyramid-level\" style=\"--level:1\"><div><h3>技能层</h3><p>雅思听说读写｜单词PK｜学术英语｜IT信息技术｜演讲表达</p></div><aside><h4>技能是工具</h4><p>语言与表达，让知识得以输出。</p></aside></div>\n   <div class=\"pyramid-layer pyramid-level\" style=\"--level:0\"><div><h3>知识层</h3><p>数学｜经济｜政治｜历史｜地理｜物理｜化学</p></div><aside><h4>知识是基础</h4><p>系统学科内容，打牢学术底层。</p></aside></div>\n  </div>\n </div>\n</section>\n<section class=\"my-course-stages\" aria-labelledby=\"my-stages-title\"><div class=\"my-section-heading\"><span class=\"eyebrow\">CURRICULUM ROADMAP</span><h2 id=\"my-stages-title\">高一打基础，高一下／高二分方向</h2><p>不是过早定死方向，而是在共同基础上逐步看见适合自己的方向。</p></div>\n <div class=\"my-stages-grid\">\n  <article class=\"my-course-column\"><div class=\"stage-title\"><h3>高一上：共同基础</h3><p>诊断 · 语言 · 通识 · 适应</p></div><div class=\"stage-block\"><h4>语言基础</h4><p>雅思基础 · 单词PK</p><small>听说读写全面强化，目标雅思阶段达标</small></div><div class=\"stage-block\"><h4>学科通识</h4><p>数学 · 经济 · 历史 · 政治 · 地理 · IT</p><small>建立跨学科基础，为分向做准备</small></div><div class=\"stage-block\"><h4>素养启蒙</h4><p>心理 · 体育 · 演讲 · 圆桌会议 · PBL入门</p><small>培养习惯、表达与协作能力</small></div></article>\n  <article class=\"my-course-column\"><div class=\"stage-title\"><h3>高一下—高二：方向衔接</h3><p>基于兴趣与基础，逐步分流</p></div><div class=\"stage-block\"><h4>文综方向</h4><p>数学、政治、历史、地理、经济</p><small>适合：商科、教育、人文社科、语言、创意艺术</small></div><div class=\"stage-block\"><h4>理综方向</h4><p>数学、物理、化学、IT、经济</p><small>适合：计算机、工程、理学、建筑环境、运动科学</small></div><div class=\"stage-block stage-highlight\"><h4>共同保留课程</h4><p>雅思 · 学术英语 · 演讲 · 圆桌会议 · PBL · 心理体育 · 成长管理</p></div></article>\n  <article class=\"my-course-column\"><div class=\"stage-title\"><h3>高二末：预科准备</h3><p>两条路线汇合，同归预科衔接</p></div><div class=\"stage-block\"><h4>成绩达标</h4><p>阶段测试通过，成绩单符合预科要求</p></div><div class=\"stage-block\"><h4>语言强化</h4><p>学术英语过关，为全英授课做准备</p></div><div class=\"stage-block\"><h4>专业方向确认</h4><p>社会科学／自然科学两大方向，升导专业明确</p></div><div class=\"stage-block\"><h4>申请准备</h4><p>预科申请材料、成长档案就绪</p></div></article>\n </div>\n</section>\n", "malaysia/foundation": "<div class=\"heading\"><span class=\"eyebrow\">FOUNDATION PROGRAMMES</span><h1>马大预科课程示例</h1></div><div class=\"foundation-samples\"><section class=\"foundation-sample\"><h2>社会科学类预科课程 <span>Foundation in Social Science</span></h2><p class=\"foundation-swipe-note\">左右滑动，查看课表</p><div class=\"foundation-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"社会科学类预科课程表，可横向滚动\"><table class=\"foundation-social\"><tbody><tr><th scope=\"row\">第一学期</th><td>思维<br>技巧</td><td>基础信息和<br>通信技术</td><td>英语1</td><td>数学</td><td>管理<br>基础</td><td>经济<br>学原理</td><td>法律<br>导论</td><th class=\"elective-heading\" rowspan=\"2\">选修课程<small>（仅选择2门课程）</small></th><td rowspan=\"2\" class=\"elective-cell\">金融学<br>导论</td><td rowspan=\"2\" class=\"elective-cell\">音乐<br>基础练习</td><td rowspan=\"2\" class=\"elective-cell\">大众传媒<br>与传播</td><td rowspan=\"2\" class=\"elective-cell\">法律<br>技能</td><td rowspan=\"2\" class=\"elective-cell\">基本<br>马来舞</td></tr><tr><th scope=\"row\">第二学期</th><td>英语2</td><td>联合<br>课程</td><td>人文<br>学科</td><td>心理学<br>基础</td><td>社会学</td><td colspan=\"2\">写作与<br>研究技巧</td></tr></tbody></table></div></section><section class=\"foundation-sample\"><h2>自然科学类预科课程 <span>Foundation in Physical Science</span></h2><p class=\"foundation-swipe-note\">左右滑动，查看课表</p><div class=\"foundation-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"自然科学类预科课程表，可横向滚动\"><table class=\"foundation-natural\"><tbody><tr><th scope=\"row\">第一学期</th><td>自我发展1</td><td>信息技术</td><td>基础英语</td><td>高等数学1</td><td>编程1</td><td>基础化学1</td><td>实用化学1</td><td>基础物理1</td><td>实用物理1</td><td>数学1</td></tr><tr><th scope=\"row\">第二学期</th><td>自我发展2</td><td>基本沟通技巧</td><td>高等数学2</td><td>编程2</td><td>基础化学2</td><td>实用化学2</td><td>基础物理2</td><td>实用物理2</td><td>数学2</td><td>数学3</td></tr></tbody></table></div></section></div>", "campus/care": "<div class=\"heading\"><span class=\"eyebrow\">GROW WITH CARE</span><h1>学习有人跟进，生活有人关心。</h1></div><section class=\"full-section care-highlights\"><h2>完整的管理与陪伴机制</h2><div class=\"full-grid\"><article class=\"full-card \"><h3>寄宿制管理</h3><p>帮助学生建立规律作息，减少外部干扰，形成稳定学习节奏。</p></article><article class=\"full-card \"><h3>手机管理</h3><p>通过合理管控，帮助学生减少注意力分散，把精力回到学习和成长本身。</p></article><article class=\"full-card \"><h3>班主任跟进</h3><p>持续关注学生学习状态、课堂表现、阶段目标与心理变化。</p></article><article class=\"full-card \"><h3>生活老师陪伴</h3><p>关注学生住宿、作息、生活适应与日常行为习惯。</p></article><article class=\"full-card \"><h3>德育主任协同</h3><p>从规则意识、行为习惯、集体生活和价值引导方面提供支持。</p></article><article class=\"full-card \"><h3>助教追踪反馈</h3><p>配合课堂教学，对学生学习过程进行跟进与提醒。</p></article></div></section>", "campus/sg": "<div class=\"heading\"><span class=\"eyebrow\">SUZHOU CAMPUS / 中新班</span><h1>在真实的校园里，看见成长的日常。</h1><p>从课堂之外的探索，到运动、艺术与寄宿生活。</p></div><div class=\"sg-carousel campus-carousel gallery-full\" data-campus-carousel role=\"region\" aria-label=\"中新班校园照片自动轮播\" aria-roledescription=\"轮播\" data-items=\"[{&quot;key&quot;: &quot;sg-banner-0&quot;, &quot;label&quot;: &quot;校园正门&quot;}, {&quot;key&quot;: &quot;sg-banner-1&quot;, &quot;label&quot;: &quot;园林水景&quot;}, {&quot;key&quot;: &quot;sg-banner-2&quot;, &quot;label&quot;: &quot;校园全景&quot;}, {&quot;key&quot;: &quot;sg-banner-3&quot;, &quot;label&quot;: &quot;运动与建筑&quot;}, {&quot;key&quot;: &quot;sg-banner-4&quot;, &quot;label&quot;: &quot;校园长廊&quot;}, {&quot;key&quot;: &quot;sg-banner-5&quot;, &quot;label&quot;: &quot;园林庭院&quot;}, {&quot;key&quot;: &quot;sg-banner-6&quot;, &quot;label&quot;: &quot;教学楼群&quot;}, {&quot;key&quot;: &quot;sg-banner-7&quot;, &quot;label&quot;: &quot;校园建筑&quot;}, {&quot;key&quot;: &quot;sg-banner-8&quot;, &quot;label&quot;: &quot ll admissions-comparison\"><table><thead><tr><th>比较维度</th><th>中新班</th><th>中马国际融合班</th></tr></thead><tbody><tr><td>国内学习地点</td><td>南京师范大学苏州实验学校</td><td>上海青浦；后续进入马大官方预科中国中心</td></tr><tr><td>国内阶段</td><td>上海校区3年，苏州南师大校区2.5年</td><td>中马班2年＋官方预科1年</td></tr><tr><td>海外阶段</td><td>国际大一12或15个月＋细分专业课程2年</td><td>马来亚大学本科3.5年</td></tr><tr><td>大学与学位</td><td>SIM对应海外合作大学</td><td>马来亚大学</td></tr><tr><td>课程进阶</td><td>高一／高二融合课程，CPB＋CFS，MFS</td><td>共同基础、文理方向、社会科学／自然科学预科</td></tr><tr><td>语言衔接</td><td>校内课程及内测达标，无需额外语言成绩</td><td>校内课程及内测达标，升学预科及马大无需额外语言成绩</td></tr><tr><td>阶段支持</td><td>延长0.5年安排及其他升学方案，详见中新班问答</td><td>分层教学、词测制度与助教追踪</td></tr></tbody></table></div><div class=\"inline-links\"><a href=\"#singapore/overview\">完整了解中新班 ↗</a><a href=\"#malaysia/overview\">完整了解中马班 ↗</a></div><a class=\"text-link compare-budget-link\" href=\"#admissions/fees\">比较两班费用与预算 ↗</a>", "admissions/fees": "<div class=\"budget-pair\"><section class=\"budget-programme\" aria-labelledby=\"budget-singapore\"><button class=\"budget-toggle\" id=\"budget-singapore\" aria-expanded=\"false\" aria-controls=\"fees-singapore\"><span>中新国际融合班</span><small>点击展开费用明细 ＋</small></button><div class=\"full-grid budget-details\" id=\"fees-singapore\" hidden><article class=\"full-card warm\"><h3>高中阶段 · 国内约40万元</h3><p>学费：12.8万元 / 学年。</p><p>住宿：约4400元 / 年，以学校标准为准。</p><p>可选美高学籍：3000美金 / 年。适合重视档案连贯、考公考编或兼顾其他升学方向的家庭。</p></article><article class=\"full-card \"><h3>本科阶段 · 国外约90万元</h3><p>学费：不同合作大学与专业不同，约6—12万元 / 年。</p><p>生活费：房租与饮食约1—1.5万元 / 月，依地段及合租方式而定。</p></article><article class=\"full-card wide budget-total\"><h3>高中至本科整体预算</h3><div class=\"budget-amount\"><span>约</span><strong>130</strong><span>万元</span></div></article></div></section><section class=\"budget-programme\" aria-labelledby=\"budget-malaysia\"><button class=\"budget-toggle\" id=\"budget-malaysia\" aria-expanded=\"false\" aria-controls=\"fees-malaysia\"><span>中马国际融合班</span><small>点击展开费用明细 ＋</small></button><div class=\"full-grid budget-details\" id=\"fees-malaysia\" hidden><articl function initPageMotion(reduced,listen){
 const headlineEffects=['title-fade','title-rise','title-drift','title-soft'];
 const frames={
  'side-left':[{opacity:0,transform:'translateX(-48px)'},{opacity:1,transform:'translateX(0)'}],
  'side-right':[{opacity:0,transform:'translateX(48px)'},{opacity:1,transform:'translateX(0)'}],
  'title-fade':[{opacity:0},{opacity:1}],
  'title-rise':[{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'translateY(0)'}],
  'title-drift':[{opacity:0,transform:'translateX(-10px)'},{opacity:1,transform:'translateX(0)'}],
  'title-soft':[{opacity:0,filter:'blur(3px)',transform:'translateY(5px)'},{opacity:1,filter:'blur(0)',transform:'translateY(0)'}],
  'page-turn':[{opacity:0,transform:'perspective(1200px) rotateX(-18deg) translateY(15px)',transformOrigin:'50% 0%'},{opacity:1,transform:'perspective(1200px) rotateX(0deg) translateY(0)',transformOrigin:'50% 0%'}]
 };
 const queue=new Map(),animations=[];
 const reveal=el=>{
  const item=queue.get(el);if(!item)return;
  queue.delete(el);observer.unobserve(el);el.dataset.motionState='running';
  const animation=el.animate(frames[item.effect],{duration:item.effect==='page-turn'?850:700,delay:item.delay,easing:'cubic-bezier(.2,.65,.3,1)',fill:'both'});
  animations.push(animation);
  animation.onfinish=()=>{el.style.opacity='';el.dataset.motionState='complete';animation.cancel();};
 };
 const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)reveal(e.target);}),{threshold:.08});
 const add=(el,effect,delay=0,immediate=false)=>{
  if(!el||el.dataset.motion)return;el.dataset.motion=effect;
  if(reduced){el.dataset.motionState='complete';return;}
  el.style.opacity='0';el.dataset.motionState='pending';queue.set(el,{effect,delay});
  if(immediate)reveal(el);else observer.observe(el);
 };
 const home=content.querySelector('.dark-hero');
 if(home){
  home.querySelectorAll('.hero-word').forEach((el,i)=>add(el,'title-rise',i*210,true));
  home.querySelectorAll('.dark-intro>span').forEach((el,i)=>add(el,'title-rise',1350+i*240,true));
  home.querySelectorAll('.hero-note-line').forEach((el,i)=>add(el,'title-fade',1850+i*220,true));
  content.querySelectorAll('.dark-programme').forEach(el=>add(el,'page-turn',1350,true));
 }
 const programme=content.querySelector('.programme-focus');
 if(programme){
  add(programme.querySelector('.focus-copy h2'),'title-fade',70,true);
  programme.querySelectorAll('.benefit').forEach((el,i)=>add(el,'page-turn',380+i*140));
 }
 content.querySelectorAll('.ability-row').forEach((el,i)=>add(el,i%2?'side-right':'side-left',90));
 // Animate an entire table together, so its rows remain aligned during the turn.
 const tables=new Set();
 content.querySelectorAll('table,[role="table"],.path-comparison').forEach(el=>tables.add(el.closest('.foundation-sample,.table-scroll')||el));
 tables.forEach(el=>add(el,'page-turn',90));
 content.querySelectorAll('h1,h2,h3,h4,#pathway-title').forEach(el=>{
  if(el.closest('.dark-hero,.dark-programme,.benefit,.belief-hero,.pyramid-layer,.curve-detail,.ability-row')||el.dataset.motion)return;
  if([...tables].some(table=>table.contains(el)))return;
  add(el,headlineEffects[Math.floor(Math.random()*headlineEffects.length)],60);
 });
 listen(content,'focusin',e=>{for(const el of queue.keys()){if(el===e.target||el.contains(e.target))reveal(el);}});
 sgCleanup.push(()=>{observer.disconnect();animations.forEach(a=>a.cancel());queue.clear();});
}

function initCampusCarousels(reduced,listen){
 content.querySelectorAll('[data-campus-carousel]').forEach(gallery=>{
  const items=JSON.parse(gallery.dataset.items),count=items.length,track=gallery.querySelector('.campus-track'),slides=[...track.children],pause=gallery.querySelector('[data-carousel-pause]');
  let index=0,cursor=1,paused=reduced,moving=false,timer=0,settleTimer=0,request=0,alive=true;
  const sync=()=>{gallery.dataset.currentSlide=String(index+1).padStart(2,'0');gallery.dataset.playing=String(!paused);gallery.querySelector('.carousel-caption b').textContent=String(index+1).padStart(2,'0')+' / '+String(count).padStart(2,'0');gallery.querySelector('.carousel-caption>span').textContent=items[index].label;gallery.querySelectorAll('[data-carousel-index]').forEach((b,j)=>{b.classList.toggle('active',j===index);b.setAttribute('aria-pressed',String(j===index));});slides.forEach((slide,j)=>{const active=j===cursor;slide.inert=!active;if(active)slide.removeAttribute('aria-hidden');else slide.setAttribute('aria-hidden','true');});pause.textContent=paused?'▶':'Ⅱ';pause.setAttribute('aria-label',paused?'播放照片轮播':'暂停照片轮播');};
  const settle=()=>{clearTimeout(settleTimer);moving=false;track.classList.remove('is-sliding');if(cursor===0||cursor===count+1){cursor=index+1;track.style.transform=`translateX(${-100*cursor}%)`;}sync();};
  const loadSlide=i=>{
   const key=items[(i+count)%count].key,src=MEDIA[key];
   track.querySelectorAll('[data-media]').forEach(img=>{if(img.dataset.media===key&&!img.getAttribute('src')){img.loading='eager';img.src=src;}});
   return readyImage(src);
  };
  const show=async(i,direction=0)=>{
   const turn=++request,next=(i+count)%count;if(next===index){delete gallery.dataset.waiting;return;}
   gallery.dataset.waiting='true';const loaded=await loadSlide(next);
   if(!alive||turn!==request)return;delete gallery.dataset.waiting;if(!loaded)return;
   if(moving)settle();cursor=direction?cursor+direction:next+1;index=next;moving=true;track.classList.toggle('is-sliding',!reduced);track.style.transform=`translateX(${-100*cursor}%)`;sync();settleTimer=setTimeout(settle,reduced?0:900);
   loadSlide(index+1);
  };
  const arm=(delay=4200)=>{clearTimeout(timer);if(paused)return;timer=setTimeout(async()=>{if(!document.hidden&&!dialog.open){await show(index+1,1);}arm();},delay);};
  listen(track,'transitionend',e=>{if(e.target===track&&e.propertyName==='transform')settle();});
  listen(gallery,'click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-carousel-pause')){paused=!paused;sync();arm();return;}if(b.hasAttribute('data-carousel-prev'))show(index-1,-1);else if(b.hasAttribute('data-carousel-next'))show(index+1,1);else if(b.hasAttribute('data-carousel-index'))show(Number(b.dataset.carouselIndex));else return;arm();});
  listen(gallery,'keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const d=e.key==='ArrowRight'?1:-1;show(index+d,d);arm();}});
  sync();loadSlide(0).then(()=>{if(alive){loadSlide(1);arm(1400);}});sgCleanup.push(()=>{alive=false;request++;clearTimeout(timer);clearTimeout(settleTimer);});
 });
}

  const items=JSON.parse(gallery.dataset.voices);let index=0,typingFrame=0,typingObserver=null;
  const photo=gallery.querySelector('.voice-photo'),image=photo.querySelector('img'),story=gallery.querySelector('.voice-story');
  const stopTyping=()=>{cancelAnimationFrame(typingFrame);typingFrame=0;if(typingObserver){typingObserver.disconnect();typingObserver=null;}};
  const typeQuote=(quote,text)=>{
   stopTyping();
   const accessible=document.createElement('span');accessible.className='voice-accessible';accessible.textContent=text;
   const visual=document.createElement('span');visual.className='voice-visual';visual.setAttribute('aria-hidden','true');
   const chars=Array.from(text).map(char=>{const span=document.createElement('span');span.className='voice-char';span.textContent=char;visual.append(span);return span;});
   quote.replaceChildren(accessible,visual);quote.dataset.typing='pending';
   if(reduced){chars.forEach(c=>c.classList.add('typed'));quote.dataset.typing='complete';return;}
   const start=()=>{
    let elapsed=0,lastTime=null,count=0;quote.dataset.typing='running';
    const tick=time=>{
     if(document.hidden){lastTime=null;typingFrame=requestAnimationFrame(tick);return;}
     if(lastTime!==null)elapsed+=Math.min(time-lastTime,100);lastTime=time;
     const target=Math.min(chars.length,Math.floor(elapsed/48)+1);
     if(target!==count){if(count)chars[count-1].classList.remove('typing-current');for(let j=count;j<target;j++)chars[j].classList.add('typed');count=target;if(count<chars.length)chars[count-1].classList.add('typing-current');}
     if(count<chars.length)typingFrame=requestAnimationFrame(tick);else{typingFrame=0;quote.dataset.typing='complete';}
    };typingFrame=requestAnimationFrame(tick);
   };
   typingObserver=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)){typingObserver.disconnect();typingObserver=null;start();}},{threshold:.2});typingObserver.observe(quote);
  };
  const show=i=>{
   index=(i+items.length)%items.length;const item=items[index];
   gallery.dataset.currentVoice=String(index+1).padStart(2,'0');
   story.querySelector('.voice-topic').textContent=item.label;typeQuote(story.querySelector('blockquote'),item.quote);
   image.src=MEDIA[item.key];image.alt='家长反馈 · '+item.label;photo.dataset.image=item.key;photo.setAttribute('aria-label','放大查看：'+image.alt);
   gallery.querySelector('.voice-counter').textContent=String(index+1).padStart(2,'0');
   gallery.querySelectorAll('[data-voice-index]').forEach(b=>{const active=Number(b.dataset.voiceIndex)===index;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});
   const strip=gallery.querySelector('.voice-thumbs'),thumb=strip.querySelector('[data-voice-index="'+index+'"]');
   const left=thumb.getBoundingClientRect().left-strip.getBoundingClientRect().left;if(left<0||left+thumb.offsetWidth>strip.clientWidth)strip.scrollLeft+=left-strip.clientWidth/2+thumb.offsetWidth/2;
   photo.classList.remove('changing');void photo.offsetWidth;photo.classList.add('changing');
  };
  show(0);sgCleanup.push(stopTyping);
  listen(gallery,'click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-voice-index'))show(Number(b.dataset.voiceIndex));else if(b.hasAttribute('data-voice-next'))show(index+1);else if(b.hasAttribute('data-voice-prev'))show(index-1);});
  listen(gallery,'keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();show(index+(e.key==='ArrowRight'?1:-1));}});
 });
}

let sgCleanup=[];
function cleanupEnhancements(){sgCleanup.forEach(fn=>fn());sgCleanup=[];}
function initEnhancements(){
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const listen=(el,event,fn)=>{el.addEventListener(event,fn);sgCleanup.push(()=>el.removeEventListener(event,fn));};
 initCampusCarousels(reduced,listen);
 initCampusBanners(reduced,listen);
 initParentVoices(listen,reduced);
 initPageMotion(reduced,listen);
 const pyramid=content.querySelector('.growth-pyramid');
 if(pyramid&&!reduced){
  pyramid.classList.add('pyramid-pending');
  const observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)){pyramid.classList.add('pyramid-running');observer.disconnect();}},{threshold:.15});
  observer.observe(pyramid);sgCleanup.push(()=>observer.disconnect());
 }
 const myComparison=content.querySelector('.my-comparison');
 if(myComparison){
  const play=()=>{myComparison.classList.remove('my-comparison-running');void myComparison.offsetWidth;myComparison.classList.add('my-comparison-running');};
  const observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)){play();observer.disconnect();}},{threshold:.25});observer.observe(myComparison);sgCleanup.push(()=>observer.disconnect());
  listen(myComparison.querySelector('[data-replay-my]'),'click',play);
 }
 const comparison=content.querySelector('.path-comparison');
 const replay=()=>{if(!comparison)return;comparison.classList.remove('comparison-running');void comparison.offsetWidth;comparison.classList.add('comparison-running');};
 if(comparison){replay();listen(content.querySelector('[data-replay-comparison]'),'click',replay);}
 content.querySelectorAll('.curve-map').forEach(map=>{
  const panel=map.closest('.path-view'),nodes=[...map.querySelectorAll('[data-curve-step]')],lastStep=nodes.length-1;
  const guides=[...map.querySelectorAll('[data-curve-guide]')],lengths=guides.map(p=>p.getTotalLength());
  const track=map.querySelector('.curve-progress'),total=track.getTotalLength();
  const stops=[0];lengths.forEach(length=>stops.push(stops[stops.length-1]+length));
  const ratio=total/stops[lastStep];stops.forEach((distance,i)=>stops[i]=distance*ratio);
  const marker=map.querySelector('.curve-marker');let step=0,elapsed=0,lastTime=null,frame=0;
  track.style.strokeDashoffset='0';track.style.strokeDasharray='0 '+(total+1);
  const show=i=>{step=i;map.dataset.currentStep=String(i+1).padStart(2,'0');nodes.forEach((n,j)=>{n.classList.toggle('active',j===i);n.classList.toggle('reached',j<=i);n.setAttribute('aria-pressed',String(j===i))});const n=nodes[i];panel.querySelector('.curve-counter').textContent=String(i+1).padStart(2,'0');panel.querySelector('.curve-detail h3').textContent=n.querySelector('strong').textContent;panel.querySelector('.curve-detail p').textContent=n.dataset.detail;};
  const draw=progress=>{
   const distance=step===lastStep?total:stops[step]+(stops[step+1]-stops[step])*progress;
   track.style.visibility=distance>0.01?'visible':'hidden';track.style.strokeDasharray=distance+' '+(total+1);
   const point=track.getPointAtLength(distance);marker.setAttribute('cx',point.x);marker.setAttribute('cy',point.y);
  };
  const stop=()=>{cancelAnimationFrame(frame);frame=0;lastTime=null;};
  const tick=time=>{
   if(document.hidden){lastTime=null;frame=requestAnimationFrame(tick);return;}
   if(lastTime!==null)elapsed+=Math.min(time-lastTime,100);lastTime=time;
   const duration=step===lastStep?2400:3500;
   if(elapsed>=duration){show((step+1)%nodes.length);elapsed=0;}
   draw(step===lastStep?1:Math.max(0,Math.min(1,(elapsed-900)/2600)));frame=requestAnimationFrame(tick);
  };
  const start=i=>{stop();elapsed=0;show(i);draw(0);if(!reduced)frame=requestAnimationFrame(tick);};
  nodes.forEach((n,i)=>listen(n,'click',()=>start(i)));sgCleanup.push(stop);
  if(map.hasAttribute('data-autostart'))start(0);
  const tabs=[...content.querySelectorAll('[data-path-tab]')];
  const select=b=>{stop();tabs.forEach(t=>{const active=t===b;t.setAttribute('aria-selected',String(active));t.tabIndex=active?0:-1;content.querySelector('#path-'+t.dataset.pathTab).hidden=!active;});if(b.dataset.pathTab==='steps')start(0);else replay();};
  tabs.forEach((b,i)=>{listen(b,'click',()=>select(b));listen(b,'keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const t=tabs[e.key==='Home'?0:e.key==='End'?1:1-i];select(t);t.focus();}});});
 });
}

const content=document.getElementById('content');
const subnav=document.getElementById('subnav');
const dialog=document.getElementById('lightbox');
let focusBeforeModal=null;
const imageRequests=new Map();
function readyImage(src){
 if(imageRequests.has(src))return imageRequests.get(src);
 const promise=new Promise(resolve=>{const img=new Image();img.decoding='async';img.onload=()=>{const decoded=img.decode?img.decode():Promise.resolve();decoded.catch(()=>{}).then(()=>resolve(img));};img.onerror=()=>{imageRequests.delete(src);resolve(null);};img.src=src;});
 imageRequests.set(src,promise);return promise;
}
function hydrate(){content.querySelectorAll('[data-media]').forEach(img=>{
 const key=img.dataset.media;img.decoding='async';img.loading='lazy';
 const slide=img.closest('.campus-slide');
 if(slide&&slide.getAttribute('aria-hidden')==='true')return;
 const thumbnail=img.closest('.carousel-selectors,.gallery-thumbs,.voice-thumbs');
 img.src=thumbnail&&typeof MEDIA_THUMB!=='undefined'?(MEDIA_THUMB[key]||MEDIA[key]):MEDIA[key];
 if(slide){img.loading='eager';img.fetchPriority='high';}
});}
let modalRequest=0;let photoItems=[],photoIndex=0;let photoSwiped=false;
const imageStatus=document.createElement('button');imageStatus.className='image-load-status';imageStatus.hidden=true;imageStatus.type='button';imageStatus.setAttribute('aria-live','polite');dialog.append(imageStatus);
function openPhoto(photo,keepGallery=false){
 if(!keepGallery){const seen=new Set();photoItems=[...content.querySelectorAll('img[data-media]')].filter(img=>{const key=img.dataset.media;if(seen.has(key))return false;seen.add(key);return true;}).map(img=>({key:img.dataset.media,label:img.alt||'校园照片'}));const carousel=photo.closest?.('[data-campus-carousel]');if(carousel)photoItems=JSON.parse(carousel.dataset.items);photoIndex=Math.max(0,photoItems.findIndex(item=>item.key===photo.dataset.image));}

 focusBeforeModal=photo;const key=photo.dataset.image,im=document.getElementById('large-image'),preview=photo.querySelector('img');
 const request=++modalRequest;const current=()=>request===modalRequest&&dialog.open;
 im.decoding='async';im.src=preview.currentSrc||MEDIA[key];im.alt=preview.alt;
 document.getElementById('image-label').textContent=im.alt;document.querySelector('.image-scroll').classList.remove('zoomed');document.getElementById('zoom-toggle').textContent='放大细读';if(!dialog.open)dialog.showModal();updatePhotoControls();document.body.classList.add('modal-open');
 const full=typeof MEDIA_FULL!=='undefined'?(MEDIA_FULL[key]||MEDIA[key]):MEDIA[key];
 imageStatus.hidden=true;imageStatus.onclick=null;
 if(new URL(full,document.baseURI).href===im.src)return;
 const sharpen=()=>{imageStatus.hidden=false;imageStatus.disabled=true;imageStatus.textContent='正在加载清晰图片…';readyImage(full).then(loaded=>{
  if(!current())return;
  if(loaded){im.src=full;imageStatus.hidden=true;imageStatus.onclick=null;}
  else{imageStatus.disabled=false;imageStatus.textContent='当前为预览图 · 点击重试清晰图片';imageStatus.onclick=sharpen;}
 });};sharpen();
}
function route(){
 cleanupEnhancements();
 let key=decodeURIComponent(location.hash.slice(1))||'home/welcome';
 key=ALIASES[key]||key;
 if(!PAGES[key])key='home/welcome';
 const [group,panel]=key.split('/');
 content.innerHTML=PAGES[key];hydrate();
 document.querySelectorAll('header [data-group]').forEach(a=>{const active=a.dataset.group===group;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 document.getElementById('subnav-wrap').hidden=group==='home';
 subnav.innerHTML=GROUPS[group].map(([id,name])=>`<a href="#${group}/${id}" class="${id===panel?'active':''}" ${id===panel?'aria-current="page"':''}>${name}</a>`).join('');
 const seq=GROUPS[group],index=seq.findIndex(([id])=>id===panel);
 const prev=index?`${group}/${seq[index-1][0]}`:'home/welcome';
 const next=index<seq.length-1?`${group}/${seq[index+1][0]}`:group==='home'?'singapore/overview':group==='singapore'?'malaysia/overview':group==='malaysia'?'education/belief':group==='education'?'campus/care':group==='campus'?'admissions/compare':group==='admissions'?'home/welcome':'home/welcome';
 const titleOf=k=>GROUPS[k.split('/')[0]].find(a=>a[0]===k.split('/')[1])[1];
 document.getElementById('page-turn').innerHTML=`<a href="#${prev}">← ${titleOf(prev)}</a><span>SEE ACADEMY / ${String(index+1).padStart(2,'0')}</span><a href="#${next}">${titleOf(next)} →</a>`;
 document.title='看见学院｜'+seq[index][1];
 document.body.dataset.group=group;
 window.scrollTo({top:0,behavior:'instant'});
 // Keep the active tab visible on small screens without scrolling the document.
 const active=subnav.querySelector('.active');if(active)subnav.scrollLeft=active.offsetLeft-subnav.offsetLeft-20;
 content.focus({preventScroll:true});
 initEnhancements();
 initMobileInteractions();
 initBudgetPanels();
}

content.addEventListener('click',e=>{
 const control=e.target.closest('[data-slide],[data-slide-step]');
 if(control){const gallery=control.closest('.campus-gallery');const items=JSON.parse(gallery.dataset.gallery);const old=Number(gallery.dataset.current||0);const i=control.hasAttribute('data-slide')?Number(control.dataset.slide):(old+Number(control.dataset.slideStep)+items.length)%items.length;gallery.dataset.current=i;const button=gallery.querySelector('.campus-visual .photo');const img=button.querySelector('img');img.src=MEDIA[items[i].key];img.alt=items[i].label;button.dataset.image=items[i].key;button.setAttribute('aria-label','放大查看：'+items[i].label);gallery.querySelector('.gallery-label').textContent=items[i].label;gallery.querySelector('.gallery-index').textContent=String(i+1).padStart(2,'0');gallery.querySelectorAll('[data-slide]').forEach((b,j)=>{b.classList.toggle('active',j===i);b.setAttribute('aria-pressed',String(j===i))});return;}

 const photo=e.target.closest('[data-image]');if(photo)openPhoto(photo);
});
document.getElementById('close-modal').onclick=()=>dialog.close();
dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
dialog.addEventListener('close',()=>{modalRequest++;imageStatus.hidden=true;imageStatus.onclick=null;document.body.classList.remove('modal-open');if(focusBeforeModal)focusBeforeModal.focus({preventScroll:true})});
document.getElementById('zoom-toggle').onclick=()=>{const on=document.querySelector('.image-scroll').classList.toggle('zoomed');document.getElementById('zoom-toggle').textContent=on?'适应窗口':'放大细读';};
window.addEventListener('hashchange',route);route();

document.querySelector('.skip-link').addEventListener('click',e=>{e.preventDefault();content.focus();content.scrollIntoView({block:'start'});});

function initMobileInteractions(){
 content.querySelectorAll('table').forEach(table=>{if(table.closest('.admissions-comparison,.foundation-scroll,.university-table'))return;if(table.parentElement.classList.contains('mobile-table'))return;const wrap=document.createElement('div');wrap.className='mobile-table';wrap.tabIndex=0;wrap.setAttribute('aria-label','左右滑动查看表格');table.before(wrap);wrap.append(table);});
 const selectors=[['[data-campus-carousel]','[data-carousel-next]','[data-carousel-prev]'],['[data-campus-banner]','[data-banner-next]','[data-banner-prev]'],['[data-voices]','[data-voice-next]','[data-voice-prev]'],['.campus-gallery','[data-slide-step="1"]','[data-slide-step="-1"]']];
 selectors.forEach(([selector,next,prev])=>content.querySelectorAll(selector).forEach(el=>{let start=null,suppress=false;el.addEventListener('touchstart',e=>{if(e.target.closest('.gallery-thumbs,.voice-thumbs,.carousel-selectors'))return;const t=e.touches[0];start=[t.clientX,t.clientY];},{passive:true});el.addEventListener('touchend',e=>{if(!start)return;const t=e.changedTouches[0],dx=t.clientX-start[0],dy=t.clientY-start[1];start=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.3){suppress=true;el.querySelector(dx<0?next:prev)?.click();setTimeout(()=>suppress=false,400);}},{passive:true});el.addEventListener('click',e=>{if(suppress&&e.isTrusted){e.preventDefault();e.stopImmediatePropagation();}},true);}));
}
document.getElementById('large-image').addEventListener('click',()=>{if(!photoSwiped)dialog.close()});
content.addEventListener('click',e=>{const img=e.target.closest('img');if(!img||e.target.closest('[data-image],.brand,[data-voice-index],.carousel-selectors,.gallery-thumbs'))return;const key=img.dataset.media||Object.keys(MEDIA).find(k=>new URL(MEDIA[k],document.baseURI).href===img.src);if(!key)return;openPhoto({dataset:{image:key},querySelector:()=>img,focus:()=>img.closest('button')?.focus()});});

function updatePhotoControls(){let bar=dialog.querySelector('.photo-browser-controls');if(!bar){bar=document.createElement('div');bar.className='photo-browser-controls';bar.innerHTML='<button type="button" aria-label="上一张图片">←</button><span></span><button type="button" aria-label="下一张图片">→</button>';dialog.append(bar);bar.firstChild.onclick=()=>stepPhoto(-1);bar.lastChild.onclick=()=>stepPhoto(1);}bar.hidden=photoItems.length<2;bar.querySelector('span').textContent=`${photoIndex+1} / ${photoItems.length} · 左右滑动`;}
function stepPhoto(step){if(photoItems.length<2)return;photoIndex=(photoIndex+step+photoItems.length)%photoItems.length;const item=photoItems[photoIndex],returnFocus=focusBeforeModal;const img=document.createElement('img');img.src=MEDIA[item.key];img.alt=item.label;openPhoto({dataset:{image:item.key},querySelector:()=>img},true);focusBeforeModal=returnFocus;}
let photoTouch=null;
dialog.addEventListener('touchstart',e=>{const t=e.touches[0];photoTouch=[t.clientX,t.clientY];},{passive:true});
dialog.addEventListener('touchend',e=>{if(!photoTouch)return;const t=e.changedTouches[0],dx=t.clientX-photoTouch[0],dy=t.clientY-photoTouch[1];photoTouch=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.3){photoSwiped=true;stepPhoto(dx<0?1:-1);setTimeout(()=>photoSwiped=false,450);}},{passive:true});

function initBudgetPanels(){
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const turn=(el,delay=0)=>{if(reduce)return;const a=el.animate([{opacity:0,transform:'perspective(900px) rotateX(-70deg)',transformOrigin:'50% 0%'},{opacity:1,transform:'perspective(900px) rotateX(0deg)',transformOrigin:'50% 0%'}],{duration:650,delay,easing:'cubic-bezier(.2,.65,.3,1)',fill:'backwards'});sgCleanup.push(()=>a.cancel());};
 content.querySelectorAll('.budget-toggle').forEach((button,i)=>{turn(button,i*140);button.onclick=()=>{const panel=document.getElementById(button.getAttribute('aria-controls')),opening=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(opening));button.querySelector('small').textContent=opening?'收起费用明细 −':'点击展开费用明细 ＋';panel.hidden=!opening;if(opening)panel.querySelectorAll('.full-card').forEach((card,j)=>turn(card,j*170));};});
}
